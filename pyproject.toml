[project]
name = "llm-api-gateway"
version = "1.0.0"
description = "LLM API Gateway with load balancing, API key management, and multi-tenant isolation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.5.2",
    "fastapi>=0.115.12",
    "httpx>=0.27.2",
    "pydantic>=2.11",
    "pyodbc>=5.2",
    "python-dotenv>=1.1.0",
    "pystray>=0.19.5",
    "Pillow>=11.0",
    "uvicorn>=0.30.6",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.11",
    "pyinstaller-hooks-contrib>=2024.10",
]

[project.scripts]
api-gateway = "backend.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
